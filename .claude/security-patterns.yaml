# Salapi-specific per-edit patterns layered on top of the security-guidance
# plugin's built-ins. These are deterministic string/regex matches with no
# model call — they fire once per pattern per file per session and append a
# reminder to Claude's context.
#
# Built-ins (Math.random for kocok? not directly. eval, pickle, dangerouslySetInnerHTML,
# .innerHTML, document.write, .github/workflows/, child_process.exec — yes.)
# These patterns add Salapi-project-specific rules on top.

patterns:
  - rule_name: math_random_in_arisan_or_paluwagan
    regex: "Math\\.random\\(\\)"
    paths:
      - "**/screens/Arisan*"
      - "**/screens/Paluwagan*"
      - "**/app/actions.ts"
      - "**/contracts/arisan_rooms/**"
      - "**/contracts/paluwagan/**"
    reminder: |
      Math.random() in arisan/paluwagan code. The kocok winner MUST come
      from a contract call's return value (arisanKocok, paluwaganCollect),
      never Math.random. Roulette animations may use timer-driven motion
      for visual decoration only — the final landing index has to equal
      the on-chain winner. See ArisanRoomScreen.tsx for the correct
      pattern.

  - rule_name: git_add_all_banned
    regex: "git add\\s+(-A|--all|\\.)\\b"
    reminder: |
      `git add -A` / `git add .` is banned in this repo. The working
      tree has many intentionally untracked artifacts (audit docs,
      prompt files, design briefs, pitch deck PDFs). Stage commits by
      path only.

  - rule_name: hardcoded_stellar_secret
    regex: "S[A-Z2-7]{55}"
    exclude_paths:
      - "**/.env.example"
      - "**/*.md"
      - "**/test/**"
      - "**/test_snapshots/**"
    reminder: |
      Looks like a hardcoded Stellar secret key (starts with S, 56 chars
      total). Secrets live in web/.env.local and are read via getSigner()
      or FRIENDS[].secret() — never hardcoded in app source. If this is
      actually a public key (starts with G) or contract ID (starts with
      C), ignore this warning.

  - rule_name: console_log_with_secret_or_signer
    regex: "console\\.(log|info|warn|error|debug)\\([^)]*(secret|signer|private[_-]?key|seed[_-]?phrase)"
    reminder: |
      Logging something whose name suggests secret/signer/private_key/
      seed material. Server-side signer values must never reach console
      output. Strip the log before commit, or replace with a redacted
      summary.

  - rule_name: no_verify_commit
    regex: "git commit[^\\n]*--no-verify"
    reminder: |
      `git commit --no-verify` bypasses pre-commit hooks (build green
      check, lint, etc.). Don't bypass hooks unless the user explicitly
      asks for it. Fix the underlying issue instead.

  - rule_name: hardcoded_currency_symbol_in_screen
    regex: "['\"](\\$|₱|Rp |₫)['\"]"
    paths:
      - "**/components/screens/**"
      - "**/app/**/*.tsx"
    exclude_paths:
      - "**/screens/TransparencyScreen.tsx"
      - "**/lib/ui/currency.ts"
      - "**/lib/i18n/dictionaries.ts"
    reminder: |
      Hardcoded currency symbol ($, ₱, Rp, ₫) in a screen file. Use the
      Money / Peso components from @/components/ui/kit — they're
      currency-aware and respect the user's display-currency preference
      (USD / PHP / IDR / VND).

  - rule_name: env_prng_in_soroban_contract
    regex: "env\\.prng\\(\\)"
    paths:
      - "**/contracts/**/lib.rs"
    reminder: |
      env.prng() inside a Soroban contract. Any storage key or token
      transfer destination derived from prng() will trap with "outside
      the footprint" because simulation and execution see different
      values. Use client-supplied values verified on-chain (see
      arisan_rooms kocok() accepting winner_idx: u32, create_room()
      accepting code: Symbol).

  - rule_name: missing_require_auth_in_write_fn
    regex: "pub fn (\\w+)\\([^)]*env: Env[^)]*\\) -> Result"
    paths:
      - "**/contracts/**/lib.rs"
    reminder: |
      A Soroban contract function returning Result was just edited.
      Verify it calls .require_auth() (host/caller/member/etc.) before
      any persistent storage write or token transfer. Read-only
      functions (get_*, has_*, *_of) don't need it.

  - rule_name: hardcoded_contract_id
    regex: "C[A-Z2-7]{55}"
    paths:
      - "**/components/**"
      - "**/app/**"
    exclude_paths:
      - "**/screens/TransparencyScreen.tsx"
      - "**/.env*"
      - "**/*.md"
    reminder: |
      Looks like a hardcoded Stellar contract ID (starts with C, 56
      chars). Contract IDs should come from web/.env.local via the
      getter functions in web/lib/server/stellar.ts, not be inlined in
      app source. Exception: the contracts panel on TransparencyScreen
      lists them as display data.

  - rule_name: i18n_key_added_but_not_in_dictionaries
    regex: "t\\(\"([a-z][a-zA-Z0-9_]*)\\.([a-zA-Z0-9_]+)\""
    paths:
      - "**/components/**"
      - "**/app/**"
    exclude_paths:
      - "**/lib/i18n/**"
    reminder: |
      You just added a t() call. Verify the key exists in ALL FOUR
      locales (en / tl / id / vi) in web/lib/i18n/dictionaries.ts. The
      Dict type is `typeof en` so the build will fail if any locale is
      missing the key — better to catch it now than at next build.
