name: contracts

# Test-gate for the Soroban contracts. Runs on Linux because the contract
# unit tests cannot link on the dev box's Windows GNU toolchain (soroban-sdk
# export-ordinal limit). No deploy, no secrets — pure `cargo test` + a wasm
# release build to prove the deploy artifacts compile.

on:
  push:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.toml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        run: cargo test --workspace
      - name: cargo build wasm (release)
        run: cargo build --workspace --release --target wasm32-unknown-unknown
