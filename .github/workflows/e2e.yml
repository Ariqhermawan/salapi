name: E2E

# Run the Playwright suite against the live production app (salapi.app):
#   - deployment_status: fires after Vercel finishes a production deploy →
#     re-tests prod once the new build is live behind the alias.
#   - workflow_dispatch: run on demand from the Actions tab.
# NOTE: we test the PUBLIC alias salapi.app, NOT deployment_status.environment_url.
# Vercel's per-deployment URLs sit behind Deployment Protection (an SSO wall), so
# a CI browser gets redirected to a Vercel login page instead of the app. The
# production alias is public and already points at the new build when a
# production deployment_status reports success.
on:
  deployment_status:
  workflow_dispatch:

# Read-only: the job only checks out the repo and tests a public URL.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (deployed URL)
    # deployment_status fires for every environment and state. The test target
    # is the production alias, so do not run it for successful Preview deploys.
    # Manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E against production
        env:
          E2E_BASE_URL: https://salapi.app
        run: npm run test:e2e
