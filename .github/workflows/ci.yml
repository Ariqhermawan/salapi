name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: cargo test + WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Unit tests
        run: cargo test --workspace --locked --verbose

      - name: D3 threshold, cap, timelock and pause controls
        run: cargo test -p disaster --locked --verbose

      - name: D4 campaign release, refund, authorization and race guards
        run: cargo test -p donation-campaign --locked --verbose

      - name: Build contract WASM
        run: cargo build --workspace --target wasm32-unknown-unknown --release --locked

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  web:
    name: web type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      # Type-check only — needs no runtime env, so it never goes spuriously red.
      # Vercel already runs the full `next build` on every push to main.
      - name: Type-check
        run: npx tsc --noEmit

      # Lint gate — same eslint flat config as local dev. Needs no runtime env.
      # Fails on errors; React-Compiler-readiness rules are warn-only by design.
      - name: Lint
        run: npm run lint

      - name: Arisan invitation binding, authenticated signer controls and commit-reveal encoding
        run: npm run test:arisan

      - name: D3 exact amounts and signer guards
        run: npm run test:disaster

      - name: D4 exact split, configuration and proof validation
        run: npm run test:campaign

      - name: D4 organizer media ownership, validation and isolated UI
        run: npm run test:campaign-media

      - name: Circles example fixtures, allocation and local support guards
        run: npm run test:circles

      - name: Local payment and verification provider simulation guards
        run: npm run test:providers

      - name: Revamp parity, four-language UI, storage failures and submission guards
        run: npm run test:revamp

      - name: Sign-out failure, retry and duplicate-request guards
        run: npm run test:signout

      - name: Profile loading, verified identity and stale response guards
        run: npm run test:profile

      - name: Account photo ownership, Google fallback, upload validation and CSP
        run: npm run test:photo

      - name: Receive sharing destinations and account-switch guards
        run: npm run test:receive

      - name: Account details privacy opt-in and authenticated owner guards
        run: npm run test:account-details

      - name: Authenticated read-only wallet history and account-switch guards
        run: npm run test:activity

      - name: Canonical Testnet wallet setup, funding retries and balance failures
        run: npm run test:wallet

      - name: CoinGecko quote validation, credential omission and market display guards
        run: npm run test:market

      - name: Prevent local-review builds in Vercel production
        run: node --experimental-strip-types --test scripts/local-preview-deployment.test.mts

      - name: PWA public-only cache freshness and offline guards
        run: node --experimental-strip-types --test scripts/pwa-service-worker.test.mts

  web-e2e-local:
    name: web E2E (local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      # Generate a disposable valid keypair so server-rendered balance reads
      # exercise the same signer path without storing or exposing a secret.
      - name: Configure ephemeral test signer
        run: |
          node - <<'NODE'
          const { Keypair } = require("@stellar/stellar-sdk");
          const { appendFileSync } = require("node:fs");
          const kp = Keypair.random();
          console.log(`::add-mask::${kp.secret()}`);
          appendFileSync(process.env.GITHUB_ENV, `SALAPI_DEMO_PUBLIC=${kp.publicKey()}\nSALAPI_DEMO_SECRET=${kp.secret()}\n`);
          NODE

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start local production server
        run: |
          nohup npm run start -- -p 4747 >/tmp/salapi-e2e-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4747/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salapi-e2e-server.log
          exit 1

      - name: Run Playwright E2E
        env:
          E2E_BASE_URL: http://localhost:4747
        run: npm run test:e2e

      - name: Upload E2E traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-traces
          path: web/test-results
          if-no-files-found: ignore

  money-path-integrity:
    name: money-path-integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The guard must detect a deliberately seeded Number() conversion; this
      # prevents a permanently-green checker that never exercises its failure.
      - name: Seeded violation demonstration
        run: node scripts/check-money-path.mjs --seeded-violation

      - name: Scan inventoried money path
        run: node scripts/check-money-path.mjs

      - name: Exact conversion and conservation tests
        run: npm run test:money
