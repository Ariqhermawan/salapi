name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: cargo test + WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Unit tests
        run: cargo test --workspace --locked --verbose

      - name: Build contract WASM
        run: cargo build --workspace --target wasm32-unknown-unknown --release --locked

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  web:
    name: web type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      # Type-check only — needs no runtime env, so it never goes spuriously red.
      # Vercel already runs the full `next build` on every push to main.
      - name: Type-check
        run: npx tsc --noEmit

      # Lint gate — same eslint flat config as local dev. Needs no runtime env.
      # Fails on errors; React-Compiler-readiness rules are warn-only by design.
      - name: Lint
        run: npm run lint

  web-e2e-local:
    name: web E2E (local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      # Generate a disposable valid keypair so server-rendered balance reads
      # exercise the same signer path without storing or exposing a secret.
      - name: Configure ephemeral test signer
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const { Keypair } = require("@stellar/stellar-sdk");
          const kp = Keypair.random();
          process.stdout.write(`SALAPI_DEMO_PUBLIC=${kp.publicKey()}\n`);
          process.stdout.write(`SALAPI_DEMO_SECRET=${kp.secret()}\n`);
          NODE

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start local production server
        run: |
          nohup npm run start -- -p 4747 >/tmp/salapi-e2e-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4747/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/salapi-e2e-server.log
          exit 1

      - name: Run Playwright E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4747
        run: npm run test:e2e

      - name: Upload E2E traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-traces
          path: web/test-results
          if-no-files-found: ignore

  money-path-integrity:
    name: money-path-integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The guard must detect a deliberately seeded Number() conversion; this
      # prevents a permanently-green checker that never exercises its failure.
      - name: Seeded violation demonstration
        run: node scripts/check-money-path.mjs --seeded-violation

      - name: Scan inventoried money path
        run: node scripts/check-money-path.mjs

      - name: Exact conversion and conservation tests
        run: npm run test:money
