name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: cargo test + WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Unit tests
        run: cargo test --workspace --verbose

      - name: Build contract WASM
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  web:
    name: web type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      # Type-check only — needs no runtime env, so it never goes spuriously red.
      # Vercel already runs the full `next build` on every push to main.
      - name: Type-check
        run: npx tsc --noEmit

      # Lint gate — same eslint flat config as local dev. Needs no runtime env.
      # Fails on errors; React-Compiler-readiness rules are warn-only by design.
      - name: Lint
        run: npm run lint
